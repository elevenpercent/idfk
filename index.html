<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Launcher</title>
<style>
  :root {
    --bg: #0e0f13;
    --panel: #171921;
    --line: #272a36;
    --text: #e6e8ef;
    --muted: #8b90a3;
    --accent: #6ea8fe;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh;
    display: grid; place-items: center;
    background: var(--bg); color: var(--text);
    font: 15px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    padding: 24px;
  }
  .card {
    width: 100%; max-width: 480px;
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 14px; padding: 24px;
  }
  h1 { margin: 0 0 4px; font-size: 18px; font-weight: 600; }
  p.sub { margin: 0 0 20px; color: var(--muted); font-size: 13px; }
  label { display: block; font-size: 12px; color: var(--muted); margin: 14px 0 5px; }
  input {
    width: 100%; padding: 10px 12px;
    background: #0e0f13; color: var(--text);
    border: 1px solid var(--line); border-radius: 8px;
    font: inherit; font-size: 14px;
  }
  input:focus { outline: none; border-color: var(--accent); }
  button {
    width: 100%; margin-top: 20px; padding: 11px;
    background: var(--accent); color: #0e0f13;
    border: 0; border-radius: 8px;
    font: inherit; font-weight: 600; cursor: pointer;
  }
  button:hover { filter: brightness(1.08); }
  .msg { margin-top: 12px; font-size: 13px; color: #ff9b9b; min-height: 18px; }
  .hint { margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--line);
          font-size: 12px; color: var(--muted); }
  code { background: #0e0f13; padding: 1px 5px; border-radius: 4px; }
</style>
</head>
<body>
  <div class="card">
    <h1>about:blank launcher</h1>
    <p class="sub">Opens a window that reports <code>about:blank</code> as its URL, with a live page inside it.</p>

    <label for="url">Site to load</label>
    <input id="url" type="text" value="https://example.com" spellcheck="false">

    <label for="tab">Tab title</label>
    <input id="tab" type="text" value="New Tab" spellcheck="false">

    <label for="icon">Favicon URL (optional)</label>
    <input id="icon" type="text" placeholder="https://.../favicon.ico" spellcheck="false">

    <button id="go">Launch</button>
    <div class="msg" id="msg"></div>

    <div class="hint">
      Inside the launched window, press <code>Ctrl</code>+<code>Shift</code>+<code>L</code>
      to show a small bar for changing the URL.
      <br><br>
      Got a room code? <a href="chat.html" style="color:var(--accent)">Open the group chat →</a>
      (paste its URL above to launch it disguised, too.)
    </div>
  </div>

<script>
function normalize(raw) {
  const v = raw.trim();
  if (!v) return "";
  return /^[a-z][a-z0-9+.-]*:\/\//i.test(v) ? v : "https://" + v;
}

function buildDoc(url, title, icon) {
  const iconTag = icon ? '<link rel="icon" href="' + icon + '">' : '';
  return `<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>${title}</title>
${iconTag}
<style>
  html, body { margin:0; height:100%; overflow:hidden; background:#fff; }
  iframe { display:block; border:0; width:100%; height:100%; }
  #bar {
    position:fixed; top:0; left:0; right:0; display:none;
    background:#171921; border-bottom:1px solid #272a36; padding:6px;
    font:13px ui-sans-serif, system-ui, sans-serif; z-index:2147483647;
  }
  #bar input {
    width:100%; padding:6px 9px; background:#0e0f13; color:#e6e8ef;
    border:1px solid #272a36; border-radius:6px; font:inherit;
  }
</style>
</head>
<body>
<div id="bar"><input id="addr" spellcheck="false" placeholder="url, then Enter"></div>
<iframe id="frame" src="${url}"
        allow="autoplay; fullscreen; clipboard-read; clipboard-write; encrypted-media"
        allowfullscreen></iframe>
<script>
(function () {
  var bar = document.getElementById('bar');
  var addr = document.getElementById('addr');
  var frame = document.getElementById('frame');
  addr.value = ${JSON.stringify(url)};

  document.addEventListener('keydown', function (e) {
    if (e.ctrlKey && e.shiftKey && (e.key === 'L' || e.key === 'l')) {
      e.preventDefault();
      var open = bar.style.display === 'block';
      bar.style.display = open ? 'none' : 'block';
      frame.style.height = open ? '100%' : 'calc(100% - 37px)';
      frame.style.marginTop = open ? '0' : '37px';
      if (!open) addr.focus(), addr.select();
    }
  });

  addr.addEventListener('keydown', function (e) {
    if (e.key !== 'Enter') return;
    var v = addr.value.trim();
    if (!v) return;
    if (v.indexOf('://') === -1) v = 'https://' + v;
    frame.src = v;
  });
})();
<\/script>
</body>
</html>`;
}

document.getElementById('go').addEventListener('click', function () {
  const msg = document.getElementById('msg');
  msg.textContent = "";

  const url = normalize(document.getElementById('url').value);
  if (!url) { msg.textContent = "Enter a URL first."; return; }

  const title = document.getElementById('tab').value || "New Tab";
  const icon = normalize(document.getElementById('icon').value);

  // Must happen synchronously inside this click, or the popup blocker kills it.
  const win = window.open('about:blank', '_blank');
  if (!win) {
    msg.textContent = "Popup blocked — allow popups for this page and try again.";
    return;
  }

  win.document.open();
  win.document.write(buildDoc(url, title, icon));
  win.document.close();
});
</script>
</body>
</html>
